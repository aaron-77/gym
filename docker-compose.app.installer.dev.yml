services:
  fitnessgym_api:
    image: aaron77/fitnessgymapi:latest
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8090}:5274"
    container_name: apicontainer
    environment:
      TZ: "${TZ:-America/Mexico_City}"
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://0.0.0.0:5274"
      SECRET_TOKEN_KEY: "${SECRET_TOKEN_KEY:?SECRET_TOKEN_KEY es obligatoria}"
      DB_CONNECTION_STRING: "${DB_CONNECTION_STRING:?DB_CONNECTION_STRING es obligatoria}"
    networks:
      - fitnessgym-net

  fitnessgym_frontend:
    image: aaron77/fitnessgymfrontend:latest
    depends_on:
      - "fitnessgym_api"
    ports:
      - "127.0.0.1:${FRONT_HOST_PORT:-8091}:5062"
    container_name: frontendcontainer
    environment:
      TZ: "${TZ:-America/Mexico_City}"
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://0.0.0.0:5062"
      BACKEND_BASE_ADDRESS: "${BACKEND_BASE_ADDRESS:-http://fitnessgym_api:5274}"
      SECRET_TOKEN_KEY: "${SECRET_TOKEN_KEY:?SECRET_TOKEN_KEY es obligatoria}"
      DB_CONNECTION_STRING: "${DB_CONNECTION_STRING:?DB_CONNECTION_STRING es obligatoria}"
    networks:
      - fitnessgym-net

networks:
  fitnessgym-net:
    external: true
    name: fitnessgym-net
    driver: bridge
