# docker-compose.template.yml - Plantilla general de la app FitnessGym
#
# Solo los secretos se mapean a variables de entorno; el resto son valores
# fijos (referencia: docker-compose.prod.yml).
#

services:
  fitnessgym_api:
    image: fitnessgymapi
    ports:
      - "127.0.0.1:8090:5274"
    build:
      context: .
      dockerfile: API/DockerFile
    container_name: apicontainer
    environment:
      TZ: "America/Mexico_City"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://0.0.0.0:5274"
      SECRET_TOKEN_KEY: "${SECRET_TOKEN_KEY:?SECRET_TOKEN_KEY es obligatoria}"
      DB_CONNECTION_STRING: "${DB_CONNECTION_STRING:?DB_CONNECTION_STRING es obligatoria}"
    networks:
      - fitnessgym-net

  fitnessgym_frontend:
    image: fitnessgymfrontend
    depends_on:
      - "fitnessgym_api"
    ports:
      - "127.0.0.1:8091:5062"
    build:
      context: .
      dockerfile: GymFrontend/DockerFile
    container_name: frontendcontainer
    environment:
      TZ: "America/Mexico_City"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://0.0.0.0:5062"
      BACKEND_BASE_ADDRESS: "http://0.0.0.0:5274"
      SECRET_TOKEN_KEY: "${SECRET_TOKEN_KEY:?SECRET_TOKEN_KEY es obligatoria}"
      DB_CONNECTION_STRING: "${DB_CONNECTION_STRING:?DB_CONNECTION_STRING es obligatoria}"
    networks:
      - fitnessgym-net

networks:
  fitnessgym-net:
    external: true
    name: fitnessgym-net
    driver: bridge
